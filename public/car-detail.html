<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Détail Véhicule – DAHBI CAR</title>
  <meta name="description" content="Détails et tarifs de location. Réservez ce véhicule chez DAHBI CAR à Casablanca.">
  <link rel="shortcut icon" href="/images/dahbi-car-logo.png">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .detail-layout { display:grid; grid-template-columns:1fr 380px; gap:2.5rem; align-items:start; }
    .detail-image-wrap { border-radius: var(--radius-lg); overflow:hidden; background:#f8fafc; border:1px solid var(--gray-100); padding:2rem; position:relative; }
    .detail-image-wrap img { width:100%; height:360px; object-fit:contain; }
    .detail-badges { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.25rem; }
    .detail-specs { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin:1.5rem 0; }
    .spec-item { padding:1rem; background:var(--gray-50); border-radius:var(--radius); text-align:center; border:1px solid var(--gray-100); }
    .spec-icon { color:var(--orange); margin-bottom:.5rem; }
    .spec-label { font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--gray-400); margin-bottom:.2rem; }
    .spec-value { font-size:.95rem; font-weight:700; color:var(--dark); }
    .features-list { display:flex; flex-wrap:wrap; gap:.5rem; }
    .feature-chip { padding:.35rem .75rem; background:var(--gray-100); border-radius:50px; font-size:.8rem; color:var(--gray-700); display:flex; align-items:center; gap:.35rem; }
    .booking-card { background:#fff; border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); border:1px solid var(--gray-100); padding:2rem; position:sticky; top:100px; }
    .price-big { font-size:2.5rem; font-weight:900; color:var(--orange); }
    .days-estimate { background:var(--gray-50); border-radius:var(--radius); padding:1rem; margin:1rem 0; font-size:.875rem; }
    .similar-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; }
    @media (max-width:1024px) { .detail-layout { grid-template-columns:1fr; } .booking-card { position:static; } .detail-specs { grid-template-columns:repeat(2,1fr); } .similar-grid { grid-template-columns:repeat(2,1fr); } }
    @media (max-width:640px) { .detail-specs { grid-template-columns:1fr 1fr; } .similar-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div id="navbar-container"></div>

<section class="page-hero" style="padding:6rem 0 3rem" id="car-hero">
  <div class="container">
    <div class="breadcrumb">
      <a href="/">Accueil</a>
      <span class="breadcrumb-sep">›</span>
      <a href="/cars">Nos Voitures</a>
      <span class="breadcrumb-sep">›</span>
      <span id="breadcrumb-car">Chargement...</span>
    </div>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
      <h1 class="page-hero-title" id="car-title">Chargement...</h1>
      <span class="badge badge-blue" id="car-category-badge" style="font-size:.9rem;padding:.35rem .85rem"></span>
    </div>
  </div>
</section>

<main class="section" style="padding-top:2rem">
  <div class="container">
    <div class="detail-layout" id="car-detail">
      <div class="cars-loading"><div class="loading-spinner"></div></div>
    </div>
  </div>

  <!-- Similar Cars -->
  <div class="container" style="margin-top:3rem" id="similar-section">
    <div class="section-header">
      <span class="section-label">Autres véhicules</span>
      <h2 class="section-title" style="font-size:1.75rem">Vous pourriez aussi aimer</h2>
    </div>
    <div class="similar-grid" id="similar-grid">
      <div class="cars-loading"><div class="loading-spinner"></div></div>
    </div>
  </div>
</main>

<div id="footer-container"></div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('navbar-container').innerHTML = LTC.getNavbarHTML('/cars');
  document.getElementById('footer-container').innerHTML = LTC.getFooterHTML();
  LTC.initNavbar(true);

  const slug = window.location.pathname.split('/').pop();

  async function loadCar() {
    try {
      const { car } = await LTC.api.get(`/api/cars/slug/${slug}`);
      document.title = `${car.name} – DAHBI CAR`;
      document.getElementById('breadcrumb-car').textContent = car.name;
      document.getElementById('car-title').textContent = car.name;
      document.getElementById('car-category-badge').textContent = car.category;

      const features = car.features ? car.features.split(',').map(f => f.trim()) : [];
      const featuresHtml = features.length ? features.map(f => `<span class="feature-chip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>${f}</span>`).join('') : '<span class="text-muted">Aucun</span>';

      const whatsappMsg = encodeURIComponent(`Bonjour, je souhaite réserver le ${car.name} à ${car.price_per_day} MAD/jour. Pouvez-vous me confirmer la disponibilité ?`);

      document.getElementById('car-detail').innerHTML = `
        <div>
          <div class="detail-image-wrap">
            ${car.is_featured ? `<span class="badge badge-orange" style="position:absolute;top:1rem;left:1rem">⭐ Populaire</span>` : ''}
            <span class="badge badge-yellow" style="position:absolute;top:1rem;right:1rem">Modèle ${car.year}+</span>
            <img src="${car.image_url}" alt="${car.name}" onerror="this.src='/images/car-002-0.webp'">
          </div>

          <div style="margin-top:2rem">
            <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:1rem">Spécifications</h2>
            <div class="detail-specs">
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                <div class="spec-label">Places</div>
                <div class="spec-value">${car.seats} personnes</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V8.6a2 2 0 0 0-.59-1.42L18 4"/><path d="M14 21V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v16"/><path d="M2 21h13"/><path d="M3 9h11"/></svg></div>
                <div class="spec-label">Carburant</div>
                <div class="spec-value">${car.fuel_type}</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="4" cy="4" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="20" cy="4" r="2"/><circle cx="7" cy="20" r="2"/><circle cx="17" cy="20" r="2"/><line x1="4" y1="6" x2="4" y2="13"/><line x1="12" y1="6" x2="12" y2="13"/><line x1="20" y1="6" x2="20" y2="13"/><line x1="4" y1="13" x2="20" y2="13"/><line x1="7" y1="13" x2="7" y2="18"/><line x1="17" y1="13" x2="17" y2="18"/></svg></div>
                <div class="spec-label">Transmission</div>
                <div class="spec-value">${car.transmission}</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
                <div class="spec-label">Année</div>
                <div class="spec-value">${car.year}</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg></div>
                <div class="spec-label">Catégorie</div>
                <div class="spec-value">${car.category}</div>
              </div>
              <div class="spec-item">
                <div class="spec-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></div>
                <div class="spec-label">Assurance</div>
                <div class="spec-value">Incluse</div>
              </div>
            </div>
          </div>

          ${car.description ? `
          <div style="margin-top:1.5rem">
            <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:.75rem">Description</h2>
            <p style="color:var(--gray-600);line-height:1.8;font-size:.95rem">${car.description}</p>
          </div>` : ''}

          <div style="margin-top:1.5rem">
            <h2 style="font-size:1.25rem;font-weight:700;margin-bottom:.75rem">Équipements inclus</h2>
            <div class="features-list">${featuresHtml}</div>
          </div>

          <!-- Inclusions -->
          <div style="margin-top:2rem;padding:1.5rem;background:var(--gray-50);border-radius:var(--radius-lg);border:1px solid var(--gray-200)">
            <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem;color:var(--dark)">✅ Inclus dans chaque location</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;font-size:.875rem;color:var(--gray-600)">
              <div>✓ Assurance tous risques</div>
              <div>✓ Kilométrage illimité</div>
              <div>✓ Livraison gratuite</div>
              <div>✓ Assistance 24h/24</div>
              <div>✓ Nettoyage du véhicule</div>
              <div>✓ Plein de carburant</div>
            </div>
          </div>
        </div>

        <!-- Booking Sidebar -->
        <div>
          <div class="booking-card">
            <div style="margin-bottom:1rem">
              <span class="price-label">À partir de</span>
              <div><span class="price-big">${car.price_per_day.toLocaleString('fr-MA')}</span> <span style="font-size:1rem;color:var(--gray-400)">MAD/jour</span></div>
              <p style="font-size:.8rem;color:var(--gray-400);margin-top:.25rem">Assurance incluse · Sans frais cachés</p>
            </div>

            <form id="booking-form" style="border-top:1px solid var(--gray-100);padding-top:1.25rem">
              <input type="hidden" id="car-id-input" value="${car.id}">
              <input type="hidden" id="car-name-input" value="${car.name}">
              <input type="hidden" id="car-price-input" value="${car.price_per_day}">

              <div class="form-group">
                <label class="form-label">Date de départ <span class="required">*</span></label>
                <input type="date" id="booking-start" class="form-control" required>
              </div>
              <div class="form-group">
                <label class="form-label">Date de retour <span class="required">*</span></label>
                <input type="date" id="booking-end" class="form-control" required>
              </div>
              <div class="days-estimate" id="days-estimate" style="display:none">
                <div style="display:flex;justify-content:space-between;font-weight:600">
                  <span id="days-text">0 jours</span>
                  <span id="total-price" style="color:var(--orange)">0 MAD</span>
                </div>
                <div style="font-size:.8rem;color:var(--gray-400);margin-top:.25rem">${car.price_per_day} MAD × <span id="days-num">0</span> jours</div>
              </div>
              <div class="form-group">
                <label class="form-label">Lieu de prise en charge</label>
                <select class="form-control" id="pickup-loc">
                  <option>Aéroport Mohammed V – Casablanca</option>
                  <option selected>Casablanca</option>
                  <option>Marrakech</option>
                  <option>Tanger</option>
                  <option>Rabat</option>
                  <option>Agadir</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Votre nom <span class="required">*</span></label>
                <input type="text" id="booking-name" class="form-control" placeholder="Prénom et nom" required>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Email <span class="required">*</span></label>
                  <input type="email" id="booking-email" class="form-control" placeholder="email@exemple.com" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Téléphone <span class="required">*</span></label>
                  <input type="tel" id="booking-phone" class="form-control" placeholder="+212 6xx xxx xxx" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Notes (optionnel)</label>
                <textarea id="booking-notes" class="form-control" rows="2" placeholder="Demandes spéciales..."></textarea>
              </div>
              <div id="booking-error" class="form-error-box d-none"></div>
              <button type="submit" class="btn btn-primary w-full" id="booking-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9c2.12 0 4.07.74 5.61 1.96"/></svg>
                Réserver maintenant
              </button>
            </form>

            <div style="margin-top:1rem;text-align:center">
              <span style="font-size:.8rem;color:var(--gray-400)">— ou —</span>
              <a href="https://wa.me/212660707200?text=${whatsappMsg}" target="_blank" class="btn btn-whatsapp w-full" style="margin-top:.75rem">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                Réserver par WhatsApp
              </a>
            </div>

            <div style="margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid var(--gray-100)">
              <div style="display:flex;gap:.75rem;font-size:.8rem;color:var(--gray-400)">
                <div>✓ Annulation flexible</div>
                <div>✓ Sans frais cachés</div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Date logic
      const today = LTC.getTodayString();
      const startInput = document.getElementById('booking-start');
      const endInput = document.getElementById('booking-end');
      startInput.min = today;
      endInput.min = today;

      function updateEstimate() {
        const start = new Date(startInput.value);
        const end = new Date(endInput.value);
        if (startInput.value && endInput.value && end > start) {
          const days = Math.ceil((end - start) / 86400000);
          const total = days * car.price_per_day;
          document.getElementById('days-text').textContent = `${days} jour${days > 1 ? 's' : ''}`;
          document.getElementById('days-num').textContent = days;
          document.getElementById('total-price').textContent = total.toLocaleString('fr-MA') + ' MAD';
          document.getElementById('days-estimate').style.display = 'block';
        } else {
          document.getElementById('days-estimate').style.display = 'none';
        }
      }

      startInput.addEventListener('change', () => { endInput.min = startInput.value; updateEstimate(); });
      endInput.addEventListener('change', updateEstimate);

      // Booking form submit
      document.getElementById('booking-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('booking-submit');
        const errEl = document.getElementById('booking-error');
        errEl.classList.add('d-none');
        btn.disabled = true;
        btn.textContent = 'Envoi en cours...';

        try {
          const result = await LTC.api.post('/api/bookings', {
            car_id: car.id,
            customer_name: document.getElementById('booking-name').value,
            customer_email: document.getElementById('booking-email').value,
            customer_phone: document.getElementById('booking-phone').value,
            pickup_location: document.getElementById('pickup-loc').value,
            dropoff_location: document.getElementById('pickup-loc').value,
            pickup_date: startInput.value,
            return_date: endInput.value,
            notes: document.getElementById('booking-notes').value
          });
          window.location.href = `/booking/confirm?ref=${result.booking_ref}`;
        } catch (err) {
          errEl.textContent = err.message;
          errEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/></svg> Réserver maintenant';
        }
      });

      // Load similar cars
      const { cars: allCars } = await LTC.api.get('/api/cars');
      const similar = allCars.filter(c => c.id !== car.id && c.category === car.category).slice(0, 3);
      if (similar.length) {
        document.getElementById('similar-grid').innerHTML = similar.map(c => LTC.renderCarCard(c)).join('');
      } else {
        document.getElementById('similar-section').style.display = 'none';
      }
      LTC.initAnimations();
    } catch (err) {
      document.getElementById('car-detail').innerHTML = `<div class="empty-state"><h3>Véhicule introuvable</h3><p>${err.message}</p><a href="/cars" class="btn btn-primary mt-4">Voir tous les véhicules</a></div>`;
    }
  }

  loadCar();
</script>
</body>
</html>

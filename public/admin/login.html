<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Connexion · DAHBI CAR</title>
  <link rel="shortcut icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0f172a 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .login-wrap { width: 100%; max-width: 440px; }
    .login-card { background: #fff; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.4); overflow: hidden; }
    .login-header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 2.5rem 2rem; text-align: center; }
    .login-header img { height: 52px; filter: brightness(0) invert(1); margin-bottom: 1rem; }
    .login-header h1 { color: #fff; font-size: 1.25rem; font-weight: 800; }
    .login-header p { color: rgba(255,255,255,0.5); font-size: .825rem; margin-top: .25rem; }
    .login-body { padding: 2.25rem 2rem; }
    .login-btn { width: 100%; padding: .875rem; font-size: 1rem; font-weight: 700; background: #f97316; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
    .login-btn:hover { background: #ea580c; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(249,115,22,0.4); }
    .login-btn:disabled { opacity: .6; transform: none; }
    .error-msg { background: #fee2e2; border: 1px solid #fca5a5; color: #dc2626; padding: .75rem 1rem; border-radius: 8px; font-size: .85rem; margin-bottom: 1rem; display: none; }
    .back-link { text-align: center; margin-top: 1.5rem; font-size: .8rem; color: rgba(255,255,255,0.4); }
    .back-link a { color: rgba(255,255,255,0.7); }
    .back-link a:hover { color: #fff; }
    .pass-wrap { position: relative; }
    .pass-toggle { position: absolute; right: .875rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94a3b8; padding: 0; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <img src="/images/logo.png" alt="DAHBI CAR">
      <h1>Espace Administrateur</h1>
      <p>Connectez-vous pour accéder au panneau de gestion</p>
    </div>
    <div class="login-body">
      <div class="error-msg" id="error-msg"></div>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Identifiant</label>
          <input type="text" id="username" class="form-control" placeholder="admin" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="pass-wrap">
            <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="pass-toggle" id="pass-toggle" aria-label="Afficher le mot de passe">
              <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="login-btn" id="login-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline-block;vertical-align:middle;margin-right:.4rem"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Se connecter
        </button>
      </form>
    </div>
  </div>
  <div class="back-link">
    <a href="/">← Retour au site</a>
  </div>
</div>

<script>
  // Password toggle
  const passInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eye-icon');
  document.getElementById('pass-toggle').addEventListener('click', () => {
    if (passInput.type === 'password') {
      passInput.type = 'text';
      eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      passInput.type = 'password';
      eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  // Login
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Connexion...';

    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Identifiants invalides');

      // Store token
      localStorage.setItem('ltc_admin_token', data.token);
      localStorage.setItem('ltc_admin_user', JSON.stringify(data.user));

      // Redirect
      window.location.href = '/admin/dashboard';
    } catch (err) {
      errEl.textContent = '❌ ' + err.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline-block;vertical-align:middle;margin-right:.4rem"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg> Se connecter';
    }
  });
</script>
</body>
</html>

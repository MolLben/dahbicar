<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voitures – Admin · DAHBI CAR</title>
  <link rel="shortcut icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-container"></div>
  <div class="admin-main">
    <div id="topbar-container"></div>
    <div class="admin-content">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;margin-bottom:1.5rem">
        <div>
          <div class="page-title">Gestion des Voitures</div>
          <div class="page-subtitle">Ajoutez, modifiez et supprimez les véhicules de la flotte.</div>
        </div>
        <button class="btn btn-primary" id="btn-add-car">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Ajouter un véhicule
        </button>
      </div>

      <!-- Toolbar -->
      <div class="table-card" style="margin-bottom:1rem;padding:1rem 1.25rem">
        <div class="toolbar">
          <div class="search-wrap">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="search-input" id="car-search" placeholder="Rechercher une voiture...">
          </div>
          <select class="form-control" id="cat-filter" style="width:auto;padding:.5rem .875rem">
            <option value="">Toutes catégories</option>
            <option>Berline</option><option>SUV</option><option>Familiale</option>
            <option>Luxe</option><option>Utilitaire</option><option>Sport</option>
          </select>
          <select class="form-control" id="avail-filter" style="width:auto;padding:.5rem .875rem">
            <option value="">Tous</option>
            <option value="1">Disponibles</option>
            <option value="0">Indisponibles</option>
          </select>
          <span id="car-count-label" style="font-size:.85rem;color:#94a3b8;margin-left:auto"></span>
        </div>
      </div>

      <!-- Table -->
      <div class="table-card" style="position:relative" id="cars-table-wrap">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Photo</th>
                <th>Voiture</th>
                <th>Catégorie</th>
                <th>Prix/jour</th>
                <th>Carburant</th>
                <th>Disponible</th>
                <th>Vedette</th>
                <th style="text-align:right">Actions</th>
              </tr>
            </thead>
            <tbody id="cars-tbody">
              <tr><td colspan="8"><div class="empty-state"><div class="spinner" style="margin:0 auto"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Car Modal -->
<div class="modal-overlay" id="car-modal" style="display:none">
  <div class="modal" style="max-width:720px">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Ajouter un véhicule</span>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="modal-body">
      <div id="modal-alert" style="display:none" class="alert"></div>
      <form id="car-form">
        <input type="hidden" id="car-id">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nom complet <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="f-name" placeholder="ex: Dacia Duster 2024" required>
          </div>
          <div class="form-group">
            <label class="form-label">Marque <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="f-brand" placeholder="Dacia" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Modèle <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="f-model" placeholder="Duster" required>
          </div>
          <div class="form-group">
            <label class="form-label">Année <span style="color:red">*</span></label>
            <input type="number" class="form-control" id="f-year" min="2018" max="2026" value="2024" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Catégorie <span style="color:red">*</span></label>
            <select class="form-control" id="f-category" required>
              <option value="">Choisir...</option>
              <option>Berline</option><option>SUV</option><option>Familiale</option>
              <option>Luxe</option><option>Utilitaire</option><option>Sport</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Prix/jour (MAD) <span style="color:red">*</span></label>
            <input type="number" class="form-control" id="f-price" min="100" step="10" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Carburant</label>
            <select class="form-control" id="f-fuel">
              <option>Diesel</option><option>Essence</option><option>Hybride</option><option>Électrique</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Transmission</label>
            <select class="form-control" id="f-trans">
              <option>Manuelle</option><option>Automatique</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nombre de places</label>
            <input type="number" class="form-control" id="f-seats" min="2" max="9" value="5">
          </div>
          <div class="form-group">
            <label class="form-label">Slug URL (auto)</label>
            <input type="text" class="form-control" id="f-slug" placeholder="dacia-duster-2024">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-control" id="f-description" rows="3" placeholder="Description détaillée du véhicule..."></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Équipements (séparés par des virgules)</label>
          <input type="text" class="form-control" id="f-features" placeholder="Climatisation, GPS, Bluetooth, Caméra de recul">
        </div>
        <div class="form-group">
          <label class="form-label">URL image</label>
          <input type="url" class="form-control" id="f-image" placeholder="https://... ou /images/...">
          <div style="margin-top:.5rem;font-size:.8rem;color:#94a3b8">Ou téléchargez un fichier :</div>
          <input type="file" id="f-image-file" accept="image/*" style="margin-top:.35rem;font-size:.8rem">
          <img id="f-image-preview" src="" alt="Aperçu" style="display:none;width:120px;height:80px;object-fit:contain;margin-top:.5rem;border:1px solid #e2e8f0;border-radius:6px">
        </div>
        <div style="display:flex;gap:2rem;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:.6rem;font-size:.875rem;cursor:pointer">
            <label class="toggle"><input type="checkbox" id="f-available" checked><span class="toggle-slider"></span></label>
            Disponible à la location
          </label>
          <label style="display:flex;align-items:center;gap:.6rem;font-size:.875rem;cursor:pointer">
            <label class="toggle"><input type="checkbox" id="f-featured"><span class="toggle-slider"></span></label>
            Mettre en vedette (homepage)
          </label>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="modal-cancel">Annuler</button>
      <button class="btn btn-primary" id="modal-save">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Enregistrer
      </button>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div class="modal-overlay" id="delete-modal" style="display:none">
  <div class="modal" style="max-width:400px">
    <div class="modal-header"><span class="modal-title">Confirmer la suppression</span></div>
    <div class="modal-body">
      <p>Êtes-vous sûr de vouloir supprimer <strong id="delete-car-name"></strong> ? Cette action est irréversible.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" id="delete-cancel">Annuler</button>
      <button class="btn btn-danger" id="delete-confirm">Supprimer</button>
    </div>
  </div>
</div>

<script src="/js/admin.js"></script>
<script>
  const { requireAuth, adminApi, toast, getSidebarHTML, getTopbarHTML, initAdminResponsive, formatMAD } = AdminUtils;
  if (!requireAuth()) throw new Error('unauth');

  document.getElementById('sidebar-container').innerHTML = getSidebarHTML('/admin/cars');
  document.getElementById('topbar-container').innerHTML = getTopbarHTML('Voitures');
  initAdminResponsive();

  let allCars = [];
  let editingId = null;
  let deletingId = null;

  // Load cars
  async function loadCars() {
    try {
      const { cars } = await adminApi.get('/api/admin/cars');
      allCars = cars;
      renderCars();
    } catch (err) { toast(err.message, 'error'); }
  }

  function renderCars() {
    const search = document.getElementById('car-search').value.toLowerCase();
    const cat = document.getElementById('cat-filter').value;
    const avail = document.getElementById('avail-filter').value;

    let filtered = allCars.filter(car => {
      if (search && !car.name.toLowerCase().includes(search) && !car.brand.toLowerCase().includes(search)) return false;
      if (cat && car.category !== cat) return false;
      if (avail !== '' && String(car.is_available) !== avail) return false;
      return true;
    });

    document.getElementById('car-count-label').textContent = `${filtered.length} véhicule${filtered.length !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('cars-tbody');
    if (!filtered.length) {
      tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg><p>Aucun véhicule trouvé</p></div></td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(car => `
      <tr>
        <td><img src="${car.image_url}" alt="${car.name}" class="car-img" onerror="this.src='/images/car-002-0.webp'"></td>
        <td>
          <div style="font-weight:600;font-size:.875rem">${car.name}</div>
          <div style="font-size:.75rem;color:#94a3b8">${car.brand} · ${car.model} · ${car.year}</div>
        </td>
        <td><span class="status status-confirmed" style="font-size:.75rem">${car.category}</span></td>
        <td style="font-weight:700;color:#f97316">${formatMAD(car.price_per_day)}</td>
        <td style="font-size:.8rem;color:#64748b">${car.fuel_type}<br>${car.transmission}</td>
        <td>
          <span class="status ${car.is_available ? 'status-active' : 'status-cancelled'}">${car.is_available ? '✓ Oui' : '✗ Non'}</span>
        </td>
        <td>
          <span class="status ${car.is_featured ? 'status-confirmed' : ''}" style="${!car.is_featured ? 'background:#f8fafc;color:#94a3b8' : ''}">${car.is_featured ? '⭐ Oui' : 'Non'}</span>
        </td>
        <td style="text-align:right">
          <div style="display:flex;gap:.4rem;justify-content:flex-end">
            <button class="btn btn-outline btn-sm btn-icon" onclick="editCar(${car.id})" title="Modifier">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn btn-danger btn-sm btn-icon" onclick="deleteCar(${car.id},'${car.name.replace(/'/g,"\\'")}')
" title="Supprimer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  // Filters
  document.getElementById('car-search').addEventListener('input', renderCars);
  document.getElementById('cat-filter').addEventListener('change', renderCars);
  document.getElementById('avail-filter').addEventListener('change', renderCars);

  // Open modal (add)
  document.getElementById('btn-add-car').addEventListener('click', () => openModal(null));

  function openModal(car) {
    editingId = car ? car.id : null;
    document.getElementById('modal-title').textContent = car ? 'Modifier le véhicule' : 'Ajouter un véhicule';
    document.getElementById('modal-alert').style.display = 'none';

    // Fill form
    document.getElementById('car-id').value = car ? car.id : '';
    document.getElementById('f-name').value = car ? car.name : '';
    document.getElementById('f-brand').value = car ? car.brand : '';
    document.getElementById('f-model').value = car ? car.model : '';
    document.getElementById('f-year').value = car ? car.year : 2024;
    document.getElementById('f-category').value = car ? car.category : '';
    document.getElementById('f-price').value = car ? car.price_per_day : '';
    document.getElementById('f-fuel').value = car ? car.fuel_type : 'Diesel';
    document.getElementById('f-trans').value = car ? car.transmission : 'Manuelle';
    document.getElementById('f-seats').value = car ? car.seats : 5;
    document.getElementById('f-slug').value = car ? car.slug : '';
    document.getElementById('f-description').value = car ? (car.description || '') : '';
    document.getElementById('f-features').value = car ? (car.features || '') : '';
    document.getElementById('f-image').value = car ? (car.image_url || '') : '';
    document.getElementById('f-available').checked = car ? Boolean(car.is_available) : true;
    document.getElementById('f-featured').checked = car ? Boolean(car.is_featured) : false;

    const preview = document.getElementById('f-image-preview');
    if (car && car.image_url) { preview.src = car.image_url; preview.style.display = 'block'; } else { preview.style.display = 'none'; }

    document.getElementById('car-modal').style.display = 'flex';
  }

  function editCar(id) {
    const car = allCars.find(c => c.id === id);
    if (car) openModal(car);
  }

  function deleteCar(id, name) {
    deletingId = id;
    document.getElementById('delete-car-name').textContent = name;
    document.getElementById('delete-modal').style.display = 'flex';
  }

  // Close modal
  ['modal-close-btn','modal-cancel'].forEach(id => {
    document.getElementById(id).addEventListener('click', () => document.getElementById('car-modal').style.display = 'none');
  });
  document.getElementById('delete-cancel').addEventListener('click', () => document.getElementById('delete-modal').style.display = 'none');

  // Auto-slug
  document.getElementById('f-name').addEventListener('input', () => {
    if (!editingId) {
      document.getElementById('f-slug').value = document.getElementById('f-name').value
        .toLowerCase().trim()
        .replace(/[àâä]/g,'a').replace(/[éèêë]/g,'e').replace(/[îï]/g,'i').replace(/[ôö]/g,'o').replace(/[ùûü]/g,'u').replace(/[ç]/g,'c')
        .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    }
  });

  // Image preview
  document.getElementById('f-image').addEventListener('input', () => {
    const url = document.getElementById('f-image').value;
    const p = document.getElementById('f-image-preview');
    if (url) { p.src = url; p.style.display = 'block'; } else { p.style.display = 'none'; }
  });
  document.getElementById('f-image-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      const p = document.getElementById('f-image-preview');
      p.src = url; p.style.display = 'block';
    }
  });

  // Save car
  document.getElementById('modal-save').addEventListener('click', async () => {
    const form = document.getElementById('car-form');
    if (!form.reportValidity()) return;
    const alertEl = document.getElementById('modal-alert');
    alertEl.style.display = 'none';
    const btn = document.getElementById('modal-save');
    btn.disabled = true; btn.textContent = 'Enregistrement...';

    try {
      // Handle file upload first
      const fileInput = document.getElementById('f-image-file');
      let imageUrl = document.getElementById('f-image').value;
      if (fileInput.files[0]) {
        const fd = new FormData();
        fd.append('image', fileInput.files[0]);
        const uploaded = await adminApi.uploadForm('/api/admin/upload', fd);
        imageUrl = uploaded.url;
      }

      const payload = {
        name: document.getElementById('f-name').value,
        brand: document.getElementById('f-brand').value,
        model: document.getElementById('f-model').value,
        year: Number(document.getElementById('f-year').value),
        category: document.getElementById('f-category').value,
        price_per_day: Number(document.getElementById('f-price').value),
        fuel_type: document.getElementById('f-fuel').value,
        transmission: document.getElementById('f-trans').value,
        seats: Number(document.getElementById('f-seats').value),
        slug: document.getElementById('f-slug').value,
        description: document.getElementById('f-description').value,
        features: document.getElementById('f-features').value,
        image_url: imageUrl,
        is_available: document.getElementById('f-available').checked ? 1 : 0,
        is_featured: document.getElementById('f-featured').checked ? 1 : 0,
      };

      if (editingId) {
        await adminApi.put(`/api/admin/cars/${editingId}`, payload);
        toast('Véhicule mis à jour avec succès !');
      } else {
        await adminApi.post('/api/admin/cars', payload);
        toast('Véhicule ajouté avec succès !');
      }

      document.getElementById('car-modal').style.display = 'none';
      await loadCars();
    } catch (err) {
      alertEl.className = 'alert alert-error';
      alertEl.textContent = err.message;
      alertEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/></svg> Enregistrer';
    }
  });

  // Confirm delete
  document.getElementById('delete-confirm').addEventListener('click', async () => {
    try {
      await adminApi.delete(`/api/admin/cars/${deletingId}`);
      toast('Véhicule supprimé.');
      document.getElementById('delete-modal').style.display = 'none';
      await loadCars();
    } catch (err) { toast(err.message, 'error'); }
  });

  loadCars();
</script>
</body>
</html>

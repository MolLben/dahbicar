<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tableau de bord – Admin · DAHBI CAR</title>
  <link rel="shortcut icon" href="/images/logo.png">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .chart-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: .5rem; }
    .chart-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #f97316, #fb923c); transition: width 1s ease; }
    .recent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .activity-item { display: flex; align-items: flex-start; gap: .75rem; padding: .875rem 0; border-bottom: 1px solid #f1f5f9; }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: .35rem; }
    @media (max-width: 900px) { .recent-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="admin-layout">
  <div id="sidebar-container"></div>
  <div class="admin-main">
    <div id="topbar-container"></div>
    <div class="admin-content">
      <div class="page-title">Tableau de bord</div>
      <div class="page-subtitle" id="dashboard-date">Bienvenue sur le panneau d'administration DAHBI CAR.</div>

      <!-- Stats -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card"><div class="stat-icon orange"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div><div class="stat-number" id="s-bookings">—</div><div class="stat-label">Réservations totales</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div><div class="stat-number" id="s-revenue">—</div><div class="stat-label">Revenus estimés</div></div></div>
        <div class="stat-card"><div class="stat-icon blue"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2z"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></div><div><div class="stat-number" id="s-cars">—</div><div class="stat-label">Véhicules en flotte</div></div></div>
        <div class="stat-card"><div class="stat-icon yellow"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div><div class="stat-number" id="s-messages">—</div><div class="stat-label">Messages reçus</div></div></div>
      </div>

      <!-- Extra stats row -->
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1.25rem;margin-bottom:2rem">
        <div class="stat-card"><div class="stat-icon orange"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div><div><div class="stat-number" id="s-pending">—</div><div class="stat-label">En attente</div></div></div>
        <div class="stat-card"><div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div><div class="stat-number" id="s-confirmed">—</div><div class="stat-label">Confirmées</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg></div><div><div class="stat-number" id="s-completed">—</div><div class="stat-label">Terminées</div></div></div>
        <div class="stat-card"><div class="stat-icon red"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div><div><div class="stat-number" id="s-cancelled">—</div><div class="stat-label">Annulées</div></div></div>
      </div>

      <!-- Recent -->
      <div class="recent-grid">
        <!-- Recent Bookings -->
        <div class="table-card">
          <div class="table-header">
            <span class="table-title">Réservations récentes</span>
            <a href="/admin/bookings" class="btn btn-outline btn-sm">Voir tout</a>
          </div>
          <div id="recent-bookings"><div class="empty-state"><div class="spinner"></div></div></div>
        </div>
        <!-- Quick Stats / Activity -->
        <div class="table-card">
          <div class="table-header">
            <span class="table-title">Messages récents</span>
            <a href="/admin/messages" class="btn btn-outline btn-sm">Voir tout</a>
          </div>
          <div id="recent-messages" style="padding:0 1.25rem"></div>
        </div>
      </div>

      <!-- Catégories chart -->
      <div class="table-card" style="margin-top:1.5rem">
        <div class="table-header"><span class="table-title">Répartition par catégorie</span></div>
        <div style="padding:1.25rem" id="category-chart"></div>
      </div>
    </div>
  </div>
</div>

<script src="/js/admin.js"></script>
<script>
  const { requireAuth, adminApi, toast, getSidebarHTML, getTopbarHTML, formatDate, formatMAD, initAdminResponsive } = AdminUtils;
  if (!requireAuth()) throw new Error('unauth');

  document.getElementById('sidebar-container').innerHTML = getSidebarHTML('/admin/dashboard');
  document.getElementById('topbar-container').innerHTML = getTopbarHTML('Tableau de bord');
  initAdminResponsive();

  const now = new Date();
  document.getElementById('dashboard-date').textContent = `Aujourd'hui : ${now.toLocaleDateString('fr-FR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' })}`;

  async function loadDashboard() {
    try {
      const data = await adminApi.get('/api/admin/stats');
      const { stats, recent_bookings, recent_messages, category_stats } = data;

      document.getElementById('s-bookings').textContent = stats.total_bookings;
      document.getElementById('s-revenue').textContent = formatMAD(stats.total_revenue);
      document.getElementById('s-cars').textContent = stats.total_cars;
      document.getElementById('s-messages').textContent = stats.total_messages;
      document.getElementById('s-pending').textContent = stats.pending_bookings;
      document.getElementById('s-confirmed').textContent = stats.confirmed_bookings;
      document.getElementById('s-completed').textContent = stats.completed_bookings;
      document.getElementById('s-cancelled').textContent = stats.cancelled_bookings;

      // Update sidebar with badge counts
      document.getElementById('sidebar-container').innerHTML = getSidebarHTML('/admin/dashboard', stats.pending_bookings, stats.unread_messages);
      initAdminResponsive();

      // Recent bookings
      const rb = document.getElementById('recent-bookings');
      if (!recent_bookings.length) {
        rb.innerHTML = '<div class="empty-state"><p>Aucune réservation</p></div>';
      } else {
        rb.innerHTML = `<div class="table-responsive"><table>
          <thead><tr><th>Référence</th><th>Client</th><th>Voiture</th><th>Statut</th></tr></thead>
          <tbody>${recent_bookings.map(b => `
            <tr>
              <td><code style="font-size:.8rem;color:#f97316">${b.booking_ref}</code></td>
              <td style="font-weight:500">${b.customer_name}</td>
              <td style="color:#64748b;font-size:.8rem">${b.car_name || '—'}</td>
              <td><span class="status status-${b.status}">${b.status}</span></td>
            </tr>
          `).join('')}</tbody>
        </table></div>`;
      }

      // Recent messages
      const rm = document.getElementById('recent-messages');
      if (!recent_messages.length) {
        rm.innerHTML = '<div class="empty-state"><p>Aucun message</p></div>';
      } else {
        rm.innerHTML = recent_messages.map(m => `
          <div class="activity-item">
            <div class="activity-dot" style="background:${m.is_read ? '#94a3b8' : '#f97316'}"></div>
            <div>
              <div style="font-weight:600;font-size:.875rem">${m.name}</div>
              <div style="font-size:.8rem;color:#64748b;margin:.1rem 0">${m.subject}</div>
              <div style="font-size:.75rem;color:#94a3b8">${formatDate(m.created_at)}</div>
            </div>
          </div>
        `).join('');
      }

      // Category chart
      const cc = document.getElementById('category-chart');
      const maxCount = Math.max(...category_stats.map(c => c.count), 1);
      cc.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem">${
        category_stats.map(c => `
          <div>
            <div style="display:flex;justify-content:space-between;font-size:.85rem;font-weight:600;margin-bottom:.35rem">
              <span>${c.category}</span><span style="color:#f97316">${c.count}</span>
            </div>
            <div class="chart-bar"><div class="chart-fill" style="width:${Math.round(c.count/maxCount*100)}%"></div></div>
          </div>
        `).join('')
      }</div>`;

    } catch (err) {
      toast('Erreur de chargement : ' + err.message, 'error');
    }
  }

  loadDashboard();
</script>
</body>
</html>

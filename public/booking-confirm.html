<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réservation Confirmée – DAHBI CAR</title>
  <link rel="shortcut icon" href="/images/dahbi-car-logo.png">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .confirm-card { max-width:680px; margin:0 auto; background:#fff; border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); overflow:hidden; }
    .confirm-header { background:linear-gradient(135deg,var(--blue) 0%,var(--blue-light) 100%); padding:3rem 2rem; text-align:center; color:#fff; }
    .confirm-icon { width:80px;height:80px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem; }
    .confirm-ref { background:rgba(255,255,255,0.15);border-radius:var(--radius);padding:.75rem 1.5rem;display:inline-block;font-size:1.25rem;font-weight:800;letter-spacing:.1em;margin-top:.75rem; }
    .confirm-body { padding:2rem; }
    .detail-row { display:flex;justify-content:space-between;align-items:center;padding:.875rem 0;border-bottom:1px solid var(--gray-100);font-size:.9rem; }
    .detail-row:last-child { border-bottom:none; }
    .detail-label { color:var(--gray-500);font-weight:500; }
    .detail-value { font-weight:700;color:var(--dark);text-align:right; }
    .status-badge { padding:.35rem .9rem;border-radius:50px;font-size:.8rem;font-weight:700; }
    .status-pending { background:#fef3c7;color:#92400e; }
    .total-row { background:var(--gray-50);margin:1rem -2rem;padding:1.25rem 2rem; }
  </style>
</head>
<body>
<div id="navbar-container"></div>

<main style="padding:7rem 1rem 4rem;min-height:100vh;background:var(--gray-50)">
  <div class="container">
    <div class="confirm-card" id="confirm-content">
      <div class="cars-loading" style="padding:4rem"><div class="loading-spinner"></div></div>
    </div>
  </div>
</main>

<div id="footer-container"></div>

<script src="/js/app.js"></script>
<script>
  document.getElementById('navbar-container').innerHTML = LTC.getNavbarHTML();
  document.getElementById('footer-container').innerHTML = LTC.getFooterHTML();
  LTC.initNavbar(true);

  const urlParams = new URLSearchParams(window.location.search);
  const ref = urlParams.get('ref');

  async function loadConfirmation() {
    if (!ref) {
      document.getElementById('confirm-content').innerHTML = `<div class="confirm-body text-center"><h2>Référence manquante</h2><p class="mt-2 text-muted">Aucune référence de réservation trouvée.</p><a href="/cars" class="btn btn-primary mt-4">Voir les voitures</a></div>`;
      return;
    }

    try {
      const { booking } = await LTC.api.get(`/api/bookings/ref/${ref}`);

      document.getElementById('confirm-content').innerHTML = `
        <div class="confirm-header">
          <div class="confirm-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h1 style="font-size:1.75rem;font-weight:800;margin-bottom:.5rem">Réservation Reçue !</h1>
          <p style="opacity:.85;font-size:.95rem">Nous vous contacterons sous 30 minutes pour confirmer.</p>
          <div class="confirm-ref">${booking.booking_ref}</div>
        </div>
        <div class="confirm-body">
          <div class="alert alert-info" style="margin-bottom:1.5rem">
            📞 Notre équipe vous contactera par téléphone ou WhatsApp sous 30 minutes pour confirmer votre réservation.
          </div>
          <h3 style="font-size:1rem;font-weight:700;margin-bottom:1rem">Récapitulatif de votre réservation</h3>
          <div class="detail-row">
            <span class="detail-label">Véhicule</span>
            <span class="detail-value">${booking.car_name || 'N/A'}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Date de départ</span>
            <span class="detail-value">${LTC.formatDate(booking.pickup_date)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Date de retour</span>
            <span class="detail-value">${LTC.formatDate(booking.return_date)}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Durée</span>
            <span class="detail-value">${booking.days} jour${booking.days > 1 ? 's' : ''}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Lieu de prise en charge</span>
            <span class="detail-value">${booking.pickup_location}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Client</span>
            <span class="detail-value">${booking.customer_name}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Email</span>
            <span class="detail-value">${booking.customer_email}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Téléphone</span>
            <span class="detail-value">${booking.customer_phone}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Statut</span>
            <span class="detail-value"><span class="status-badge status-pending">⏳ En attente de confirmation</span></span>
          </div>
          <div class="detail-row total-row">
            <span style="font-size:1rem;font-weight:700">Total estimé</span>
            <span style="font-size:1.5rem;font-weight:900;color:var(--orange)">${booking.total_price.toLocaleString('fr-MA')} MAD</span>
          </div>
          <div style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.5rem">
            <a href="https://wa.me/212660707200?text=Bonjour%2C%20ma%20r%C3%A9f%C3%A9rence%20est%20${booking.booking_ref}" target="_blank" class="btn btn-whatsapp" style="flex:1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Contacter sur WhatsApp
            </a>
            <a href="/cars" class="btn btn-outline" style="flex:1">Voir d'autres véhicules</a>
          </div>
        </div>
      `;
    } catch (err) {
      document.getElementById('confirm-content').innerHTML = `<div class="confirm-body text-center"><h2>Réservation introuvable</h2><p class="mt-2 text-muted">${err.message}</p><a href="/" class="btn btn-primary mt-4">Retour à l'accueil</a></div>`;
    }
  }

  loadConfirmation();
</script>
</body>
</html>
